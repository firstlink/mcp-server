[build-system]
requires = [
    "setuptools >= 72.1",
    "versioneer[toml]",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "Firstlink Consulting MCP"
description = "Lightweight SDK for Amazon Bedrock Inline Agents"
dependencies = [
  "pydantic == 2.10.2",
  "termcolor == 2.5.0",
  "rich == 13.9.4",
  "pydantic-settings == 2.8.1",
  "wrapt == 1.17.2",
  "boto3 == 1.37.21",
  "botocore == 1.37.23",
  "mcp == 1.6.0"
]
requires-python = ">= 3.11"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSES/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]


[project.scripts]
InlineAgent_hello = "InlineAgent.hello_world:main"